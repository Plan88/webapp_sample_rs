[package]
name = "webapp_sample_rs"
version = "0.1.0"
edition = "2024"

[[bin]]
name = "server"
path = "src/main.rs"

[dependencies]
anyhow = "1.0.98"
axum = { version = "0.8.3", default-features = false, features = ["tokio", "http1", "json"] }
serde = { version = "1.0.219", default-features = false, features = ["derive"] }
tokio = { version = "1.44.2", default-features = false, features = ["macros", "net", "rt-multi-thread"] }
tracing = { version = "0.1.41", default-features = false }
tracing-subscriber = { version = "0.3.19", default-features = false, features = ["json", "env-filter", "fmt", "local-time"] }
